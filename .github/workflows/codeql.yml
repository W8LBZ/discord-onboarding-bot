# CodeQL: GitHub's code scanner, for security bugs in the Python. Results are under Security → Code scanning.
# (Free on public repositories; a private one needs GitHub Advanced Security.)
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
