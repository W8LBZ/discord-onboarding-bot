# Security checks on every pull request, every push to main, and every Monday (a newly published advisory is caught
# even in a week with no changes). Run one by hand from the Actions tab (Run workflow).
#  - dependencies: pip-audit, the packages requirements.txt resolves to, against the PyPI and OSV advisory databases
#  - secrets: gitleaks, keys, tokens and passwords anywhere in the git history (not just the current files)
# Third-party actions are pinned to a commit (a moved tag can't change what runs); Dependabot keeps the pins current.
name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Known vulnerabilities in the packages
        run: uvx pip-audit -r requirements.txt --strict --progress-spinner off
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history
      - name: gitleaks 8.30.1 (checked against its published checksum)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --verbose .
