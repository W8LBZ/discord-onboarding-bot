# Dependabot: a weekly pull request when a Python package (requirements.txt) or a GitHub Action has a newer version,
# and right away for a security fix. Review and merge like any PR; the tests and security checks run on it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
